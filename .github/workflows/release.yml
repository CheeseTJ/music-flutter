name: Release

# 推送 v* tag 时：分析 → 构建 APK → 创建 GitHub Release 并附 APK
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，会退回 debug 签名（每次构建签名都不同），导致无法覆盖安装"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=PGYER_API_KEY=${{ secrets.PGYER_API_KEY }}

      - name: Verify APK signature
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk \
            | grep -E 'Owner|SHA256' || true

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk music-app-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: music-app-*.apk
