name: music_app
description: Personal Cloud Music App
publish_to: 'none'
version: 1.2.20+33

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Material 内置文案（对话框按钮、tooltip）的中文本地化
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  just_audio: ^0.9.38
  audio_service: ^0.18.15
  dio: ^5.4.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  crypto: ^3.0.3
  file_picker: ^8.0.0
  cached_network_image: ^3.4.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# objective_c 9.6.1 的 build hook 用了 Architecture.arm64e，当前 Dart SDK(3.13.3)
# 里没有这个枚举成员，会让 assembleRelease 的 native assets 阶段直接编译失败。
# pubspec.lock 没有入库，CI 每次全新解析就会拉到它，所以这里钉住可用的 9.5.0。
dependency_overrides:
  objective_c: 9.5.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/k.data
    - assets/icons/
